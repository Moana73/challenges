<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <title>Challenges</title>
    <meta name="theme-color" content="#f0353f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Challenges" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!--
      起動直後に表示する全画面スケルトン。
      JSバンドルの読み込み・認証確認・IndexedDBの読み出しを待たず、
      HTMLパース直後にブラウザが描画できるようインラインで置いている
      （「開いた瞬間」に何も表示されない空白時間を作らないため）。
    -->
    <div id="boot-skeleton" class="skeleton-screen">
      <div class="sk sk-capture"></div>
      <div class="sk sk-segmented"></div>
      <div class="sk sk-card"></div>
      <div class="sk sk-card"></div>
      <div class="sk sk-card"></div>
      <div class="sk sk-card"></div>
      <div class="sk sk-card" style="opacity: 0.6"></div>
    </div>

    <div id="app" aria-hidden="true"></div>

    <script type="module" src="/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
